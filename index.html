<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Bông ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:#020205;
  color:#fff;
  font-family:Montserrat,sans-serif;
}
.scene{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 50% 45%, rgba(111,32,65,.22), transparent 30%),
    radial-gradient(circle at 50% 100%, rgba(190,55,92,.10), transparent 40%),
    #020205;
}
.vignette{position:absolute;inset:0;box-shadow:inset 0 0 180px #000;pointer-events:none;z-index:5}
.stars{position:absolute;inset:0}
.star{
  position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;
  opacity:.45;animation:twinkle var(--d) ease-in-out infinite alternate;
}
@keyframes twinkle{to{opacity:.08;transform:scale(.35)}}

.content{text-align:center;position:relative;z-index:4;width:90%;max-width:900px}
.line{
  opacity:0;letter-spacing:8px;text-transform:uppercase;
  font-size:11px;font-weight:300;color:rgba(255,255,255,.58);
  transform:translateY(15px);transition:2s ease;
}
.line.show{opacity:1;transform:translateY(0)}
.main{
  margin-top:22px;font-family:"Cormorant Garamond",serif;
  font-size:clamp(58px,11vw,135px);font-weight:400;
  line-height:.9;letter-spacing:2px;
  opacity:0;filter:blur(12px);transform:scale(1.04);
  transition:2.8s cubic-bezier(.16,1,.3,1);
  background:linear-gradient(110deg,#fff 20%,#ffd9e5 50%,#fff 80%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.main.show{opacity:1;filter:blur(0);transform:scale(1)}
.heart{
  display:inline-block;color:#ff668d;font-size:.42em;vertical-align:middle;
  margin-left:12px;filter:drop-shadow(0 0 18px rgba(255,74,120,.75));
  animation:heartBeat 1.7s ease-in-out infinite;
}
@keyframes heartBeat{50%{transform:scale(1.13)}}

.subtitle{
  margin-top:28px;font-size:12px;letter-spacing:5px;color:rgba(255,255,255,.48);
  opacity:0;transform:translateY(12px);transition:2s ease;
}
.subtitle.show{opacity:1;transform:translateY(0)}

.flash{
  position:absolute;inset:0;background:#fff;z-index:10;pointer-events:none;
  opacity:0;animation:flash 1.3s ease forwards;
}
@keyframes flash{0%,65%{opacity:0}72%{opacity:.12}100%{opacity:0}}

.glow{
  position:absolute;width:420px;height:420px;border-radius:50%;
  background:rgba(255,66,120,.08);filter:blur(90px);
  opacity:0;transition:3s ease;
}
.glow.show{opacity:1}

.intro{
  position:absolute;inset:0;z-index:20;background:#020205;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;transition:1.8s cubic-bezier(.77,0,.18,1);
}
.intro.hide{opacity:0;transform:scale(1.08);pointer-events:none}
.intro p{font-size:11px;letter-spacing:6px;color:rgba(255,255,255,.55);margin-bottom:28px}
.btn{
  border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;
  padding:15px 32px;border-radius:100px;letter-spacing:4px;font-size:10px;
  cursor:pointer;transition:.4s;font-family:Montserrat,sans-serif;
}
.btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.55);transform:translateY(-2px)}

.progress{
  position:absolute;bottom:38px;left:50%;transform:translateX(-50%);
  width:100px;height:1px;background:rgba(255,255,255,.12);z-index:6;
}
.progress span{display:block;width:0;height:100%;background:#fff;transition:width 8s linear}

.particle{
 position:absolute;width:3px;height:3px;border-radius:50%;background:#ff9db7;
 opacity:0;z-index:3;filter:blur(.5px);
 animation:float 6s ease-in-out forwards;
}
@keyframes float{
  0%{opacity:0;transform:translate(0,30px) scale(.5)}
  20%{opacity:.5}
  80%{opacity:.18}
  100%{opacity:0;transform:translate(var(--x),-180px) scale(1)}
}
</style>
</head>
<body>
<div class="scene">
  <div class="stars" id="stars"></div>
  <div class="glow" id="glow"></div>

  <div class="content">
    <div class="line" id="line">There is something I want you to know</div>
    <div class="main" id="main">Anh yêu Bông <span class="heart">♥</span></div>
    <div class="subtitle" id="sub">more than words could ever say</div>
  </div>

  <div class="progress"><span id="progress"></span></div>
  <div class="vignette"></div>
  <div class="flash"></div>

  <div class="intro" id="intro">
    <p>FOR SOMEONE SPECIAL</p>
    <button class="btn" id="start">MỞ RA</button>
  </div>
</div>

<script>
const stars=document.getElementById('stars');
for(let i=0;i<110;i++){
  const s=document.createElement('i');
  s.className='star';
  s.style.left=Math.random()*100+'%';
  s.style.top=Math.random()*100+'%';
  s.style.setProperty('--d',(2+Math.random()*5)+'s');
  s.style.opacity=.15+Math.random()*.5;
  stars.appendChild(s);
}

const intro=document.getElementById('intro');
const line=document.getElementById('line');
const main=document.getElementById('main');
const sub=document.getElementById('sub');
const glow=document.getElementById('glow');
const progress=document.getElementById('progress');

document.getElementById('start').onclick=()=>{
  intro.classList.add('hide');
  progress.style.width='100%';

  setTimeout(()=>line.classList.add('show'),900);
  setTimeout(()=>glow.classList.add('show'),1700);
  setTimeout(()=>main.classList.add('show'),2600);
  setTimeout(()=>sub.classList.add('show'),4700);

  for(let i=0;i<28;i++){
    setTimeout(()=>{
      const p=document.createElement('i');
      p.className='particle';
      p.style.left=(35+Math.random()*30)+'%';
      p.style.top=(55+Math.random()*25)+'%';
      p.style.setProperty('--x',(Math.random()*160-80)+'px');
      p.style.animationDuration=(4+Math.random()*4)+'s';
      document.querySelector('.scene').appendChild(p);
      setTimeout(()=>p.remove(),8000);
    },2800+i*130);
  }
};
</script>
</body>
</html>
